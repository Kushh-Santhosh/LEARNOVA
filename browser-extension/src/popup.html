<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LEARNOVA Companion</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      font-size: 24px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
    .info {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">👨‍🏫</span>
    <div>
      <div class="title">Professor Nova Companion</div>
      <div id="status" class="status-badge">Checking Backend...</div>
    </div>
  </div>

  <button class="btn" id="guide-tab-btn">Activate Guidance on This Tab</button>
  <button class="btn btn-secondary" id="open-classroom-btn">Open LEARNOVA Classroom</button>

  <div class="info">
    <strong>Privacy Guarantee:</strong> Nova only observes the active tab when requested. Never silently captures, never types passwords or submits forms.
  </div>

  <script src="popup.js"></script>
</body>
</html>

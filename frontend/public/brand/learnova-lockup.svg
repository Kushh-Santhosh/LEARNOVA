<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <!-- LEARNOVA Full Brand Lockup (Mark + Wordmark) -->
  <defs>
    <linearGradient id="lockup-grad" x1="12" y1="12" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Abstract 'L' Mark -->
  <g transform="translate(4, 4) scale(0.56)">
    <!-- Foundation Stem -->
    <rect x="28" y="22" width="16" height="58" rx="8" fill="url(#lockup-grad)" />
    <!-- Learning Orbit Arc -->
    <path
      d="M 36 72 C 36 92 48 102 70 102 C 90 102 104 88 104 68 C 104 50 90 38 72 38"
      stroke="url(#lockup-grad)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Insight Focal Node -->
    <circle cx="72" cy="38" r="9" fill="#0EA5E9" />
    <circle cx="72" cy="38" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text
    x="84"
    y="46"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="2.2"
    fill="#0F172A"
  >
    LEARN<tspan fill="#2563EB">NOVA</tspan>
  </text>
  <text
    x="85"
    y="62"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
    font-size="8.5"
    font-weight="600"
    letter-spacing="1.4"
    fill="#64748B"
  >
    ADAPTIVE AI CLASSROOM
  </text>
</svg>
